name: Build
on:
  push:
    branches: [ 'main' ]
    tags: [ '**' ]
  pull_request:
    paths-ignore:
      - docs/**
  workflow_dispatch:

# A new push to a PR cancels its superseded run; every other run (main, tags, dispatch) gets its own group and is never cancelled or queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    needs: [ ]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:

          - job_name: lint
            run_script: bun run lint

          - job_name: format
            run_script: bun run format:check

          - job_name: build
            run_script: |
              bun run build
              CONTEMBER_TEST_BUILT_CLI=1 bun test --conditions=typescript packages/cli/tests/cases/unit/cli-process.test.ts packages/create/tests/cases/unit/create-process.test.ts

          - job_name: api-exporter
            run_script: |
              bun add @microsoft/api-extractor ajv
              bun run pre-build
              bun run ts:build
              bun run ae:test

          - job_name: lint-imports
            run_script: bunx deptective

          - job_name: test
            # Source-level process tests require generated GraphQL client barrels.
            run_script: |
                bun run pre-build
                bun run test
                bun run test:legacy-decorators

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Install deps
        run: |
          bun --version
          bun install --frozen-lockfile

      - name: Run ${{ matrix.job_name }}
        run: ${{ matrix.run_script }}


  snapshot:
    # Guards that engine-{tenant,system}-api/src/migrations/snapshot.ts is in sync
    # with the migrations: bootstraps two fresh DBs (full replay vs snapshot
    # fast-path) and diffs their schemas. Fails if snapshot.ts drifted —
    # regenerate with ./scripts/create-migrations-snapshot/run.sh <tenant|system>.
    needs: [ ]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Install deps
        run: |
          bun --version
          bun install --frozen-lockfile
          sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Verify migrations snapshots
        run: ./scripts/create-migrations-snapshot/verify.sh
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres

  migration-order:
    # Guards that a PR does not introduce an engine migration whose filename
    # sorts BEFORE the newest migration already on the base branch — such a
    # migration would replay in a different relative order on a fresh DB than on
    # an already-migrated production DB. Pure-git, no database needed.
    needs: [ ]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check migration ordering against base
        run: ./scripts/migrations/check-migration-order.sh "origin/${{ github.base_ref || github.event.repository.default_branch }}"

  engine-image:
    # The engine images are otherwise built only on a tag. Builds each one, checks it carries no npm/corepack (and no outdated OS package),
    # boots it on an empty PostgreSQL (tenant migrations), migrates a project through it (system + content migrations) and boots it again with two cluster workers.
    needs: [ ]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [ node-alpine, node-debian, bun-alpine, bun-debian ]
    services:
      mailhog:
        image: mailhog/mailhog
        env:
          MH_CORS_ORIGIN: "*"
        ports:
          - 8025:8025
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -f scripts/docker/server-${{ matrix.image }}.dockerfile -t contember-engine:ci .
      - name: No npm/corepack in the image
        run: |
          docker run --rm --entrypoint sh contember-engine:ci -c \
            '! command -v npm && ! command -v npx && ! command -v corepack && test ! -e /usr/local/lib/node_modules/npm && test ! -e /usr/local/lib/node_modules/corepack'
      - name: OS packages upgraded
        if: endsWith(matrix.image, '-alpine')
        # `apk update` fails on an unreachable index; `apk version` alone would print nothing and pass.
        run: |
          docker run --rm --entrypoint sh contember-engine:ci -c \
            'set -e; apk update >/dev/null; apk version -l "<" >/tmp/v; outdated=$(tail -n +2 /tmp/v); echo "$outdated"; test -z "$outdated"'
      - name: OS packages upgraded (debian)
        if: endsWith(matrix.image, '-debian')
        # Without `--error-on=any`, `apt-get update` only warns on an unreachable index and the check would pass on stale lists.
        # `full-upgrade` also lists a fix that the Dockerfile's `upgrade` keeps back because it needs a new dependency.
        run: |
          docker run --rm --entrypoint sh contember-engine:ci -c \
            'set -e; apt-get update --error-on=any >/dev/null; apt-get -s full-upgrade >/tmp/u; outdated=$(grep "^Inst" /tmp/u || true); echo "$outdated"; test -z "$outdated"'
      - name: Start engine
        run: |
          docker run --detach --name engine --network host \
            -e DEFAULT_DB_HOST=127.0.0.1 \
            -e DEFAULT_DB_PORT=5432 \
            -e DEFAULT_DB_USER=postgres \
            -e DEFAULT_DB_PASSWORD=postgres \
            -e TENANT_DB_NAME=test_tenant \
            -e CONTEMBER_ROOT_TOKEN=0000000000000000000000000000000000000000 \
            -e CONTEMBER_LOGIN_TOKEN=1111111111111111111111111111111111111111 \
            contember-engine:ci
          for _ in $(seq 1 30); do
            curl --silent --fail localhost:4000/ && exit 0
            sleep 1
          done
          docker logs engine
          exit 1
      - name: Tenant migrations ran
        run: |
          count=$(docker exec ${{ job.services.postgres.id }} psql -U postgres -d test_tenant -tAc 'select count(*) from tenant.migrations')
          echo "tenant migrations executed: $count"
          test "$count" -gt 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Install deps
        # pre-build generates the tenant client the e2e tester calls.
        run: |
          bun install --frozen-lockfile
          bun run pre-build
      - name: Migrate a project through the image
        run: bun test --conditions=typescript e2e/cases/system/system-migrate.test.ts
        env:
          CONTEMBER_API_URL: "http://localhost:4000"
          CONTEMBER_ROOT_TOKEN: '0000000000000000000000000000000000000000'
          CONTEMBER_LOGIN_TOKEN: '1111111111111111111111111111111111111111'
          MAILHOG_URL: "http://localhost:8025"
      - name: Boot in cluster mode
        # The master forks the workers and collects default metrics itself; "Contember API running" is logged only once every worker reported in.
        run: |
          docker stop engine
          docker run --detach --name engine-cluster --network host \
            -e DEFAULT_DB_HOST=127.0.0.1 \
            -e DEFAULT_DB_PORT=5432 \
            -e DEFAULT_DB_USER=postgres \
            -e DEFAULT_DB_PASSWORD=postgres \
            -e TENANT_DB_NAME=test_tenant \
            -e CONTEMBER_ROOT_TOKEN=0000000000000000000000000000000000000000 \
            -e CONTEMBER_LOGIN_TOKEN=1111111111111111111111111111111111111111 \
            -e CONTEMBER_WORKER_COUNT=2 \
            contember-engine:ci
          for _ in $(seq 1 60); do
            if docker logs engine-cluster 2>&1 | grep -q 'Contember API running'; then
              workers=$(docker logs engine-cluster 2>&1 | grep -c 'Starting worker')
              echo "workers started: $workers"
              test "$workers" -eq 2
              curl --silent --fail --output /dev/null localhost:4000/
              metrics=$(curl --silent --fail localhost:4001/metrics)
              grep -q '^contember_info' <<<"$metrics"
              exit 0
            fi
            # a master that crashed at boot does not come back
            test "$(docker inspect --format '{{.State.Running}}' engine-cluster)" = true || break
            sleep 1
          done
          docker logs engine-cluster
          exit 1
      - name: Engine logs
        if: always()
        run: |
          docker logs engine || true
          docker logs engine-cluster || true

  cli-image:
    # The CLI images are otherwise built only on a tag. Builds each one, checks it carries no npm/corepack and no outdated OS package, and runs it.
    needs: [ ]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [ bun, node ]
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -f scripts/docker/cli-${{ matrix.image }}.dockerfile -t contember-cli:ci .
      - name: No npm/corepack in the image
        run: |
          docker run --rm --entrypoint sh contember-cli:ci -c \
            '! command -v npm && ! command -v npx && ! command -v corepack && test ! -e /usr/local/lib/node_modules/npm && test ! -e /usr/local/lib/node_modules/corepack'
      - name: OS packages upgraded
        # `apk update` fails on an unreachable index; `apk version` alone would print nothing and pass.
        run: |
          docker run --rm --entrypoint sh contember-cli:ci -c \
            'set -e; apk update >/dev/null; apk version -l "<" >/tmp/v; outdated=$(tail -n +2 /tmp/v); echo "$outdated"; test -z "$outdated"'
      - name: CLI runs
        run: docker run --rm --network none contember-cli:ci version

  test-db:
    needs: [ ]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: [ 14, 15, 16, 17, 18 ]
        # one leg runs the content API on graphql-json; the others on the default graphql-js
        include:
          - postgres: 18
            engine: graphql-json
    services:
      mailhog:
        image: mailhog/mailhog
        env:
          MH_CORS_ORIGIN: "*"
        ports:
          - 8025:8025
          - 1025:1025
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
            bun-version: 1.4.5
      - name: Install deps
        run: |
          bun --version
          bun install --frozen-lockfile
      - name: build
        run: bun run pre-build
      - name: "Run database integration tests"
        # These skip without MEMORY_TEST_DATABASE_URL / MIGRATION_TEST_DATABASE_URL, so the `check` test job (no PostgreSQL) never runs them.
        run: bun test --conditions=typescript packages/database/tests/cases/integration packages/engine-http/tests/cases/integration packages/engine-system-api/tests/cases/integration
        env:
          MEMORY_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          MIGRATION_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      - name: "Build server"
        run: ./scripts/server-build/run.sh

      - name: Start server
        run: ./e2e/start-server.sh
        env:
          NODE_ENV: production
          DEFAULT_DB_HOST: 127.0.0.1
          DEFAULT_DB_PASSWORD: postgres
          DEFAULT_DB_USER: postgres
          DEFAULT_DB_PORT: 5432
          DEFAULT_DB_STATEMENT_TIMEOUT_MS: 3000
          DEFAULT_DB_QUERY_TIMEOUT_MS: 3000
          TENANT_DB_NAME: test_tenant
          CONTEMBER_PORT: 4000
          CONTEMBER_MONITORING_PORT: 4001
          CONTEMBER_ROOT_TOKEN: '0000000000000000000000000000000000000000'
          CONTEMBER_LOGIN_TOKEN: '1111111111111111111111111111111111111111'
          CONTEMBER_PANEL_ENABLED: 'true'
          CONTEMBER_CONTENT_API_FORCE_PRIMARY_HEADER: 'true'
          CONTEMBER_CONTENT_API_GRAPHQL_ENGINE: ${{ matrix.engine }}
          TENANT_MAILER_HOST: 'localhost'
          TENANT_MAILER_PORT: '1025'
          TENANT_MAILER_FROM: 'contember@localhost'
      - name: "Run tenant database integration tests"
        run: bun test --conditions=typescript packages/engine-tenant-api/tests/cases/integration/database --no-file-parallelism
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 5432
          TEST_DB_USER: postgres
          TEST_DB_PASSWORD: postgres
          TEST_DB_NAME: test_tenant
      - name: "Run E2E tests"
        # No parallelism flag needed: bun runs test files sequentially unless --parallel is given.
        run: bun run test:e2e
        env:
          CONTEMBER_API_URL: "http://localhost:4000"
          CONTEMBER_ROOT_TOKEN: '0000000000000000000000000000000000000000'
          CONTEMBER_LOGIN_TOKEN: '1111111111111111111111111111111111111111'
          MAILHOG_URL: "http://localhost:8025"
