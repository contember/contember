name: Publish
on:
  push:
    tags:
      - '**'
permissions:
  id-token: write
  contents: read
jobs:
  publish-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'yarn'
          registry-url: 'https://registry.npmjs.org'

      - name: "Install yarn deps"
        run: yarn install

      - name: Extract version
        id: versions
        uses: ./.github/actions/extract-version
        with:
          version: ${{ github.ref }}

      - name: "Build app"
        run: yarn run build

      # Trusted publishing needs npm 11.5.1 or newer; Node 20 ships npm 10.
      - name: "Install npm with trusted publishing"
        run: npm install -g npm@^11.5.1

      - name: "Publish NPM"
        run: bash ./scripts/npm/publish.sh
        env:
          NPM_TAG: ${{ steps.versions.outputs.npmTag }}

  publish-docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [cli, engine-alpine, engine-debian, engine-ee-alpine, engine-ee-debian]
    steps:
      - uses: actions/checkout@v1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'yarn'

      - name: "Install yarn deps"
        run: yarn install

      - name: Extract version
        id: versions
        uses: ./.github/actions/extract-version
        with:
          version: ${{ github.ref }}

      - name: "Publish Docker"
        run: bash ./scripts/docker/publish.sh ${{ matrix.image }}
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_TAGS: ${{ steps.versions.outputs.versions }}
