services:

  playground:
    image: oven/bun:1.3.10
    command: 'bun run start'

    environment:
      NODE_ENV: 'development'
      VITE_CONTEMBER_ADMIN_API_BASE_URL: 'http://localhost:3001'
      VITE_CONTEMBER_ADMIN_SESSION_TOKEN: '0000000000000000000000000000000000000000'

    working_dir: /src/packages/playground
    volumes:
      - .:/src:cached

  test:
    image: oven/bun:1.3.10
    working_dir: /src
    volumes:
      - .:/src:cached
    deploy:
      replicas: 0
    environment:
      NODE_ENV: development
      CONTEMBER_API_URL: 'http://engine:4000'
      CONTEMBER_ROOT_TOKEN: '0000000000000000000000000000000000000000'
      CONTEMBER_LOGIN_TOKEN: '1111111111111111111111111111111111111111'
      MAILHOG_URL: 'http://mailhog:8025'
    entrypoint:
      - bun
      - "--conditions=typescript"
      - "test"
  engine:
    image: oven/bun:1.3.10
    working_dir: /src

    environment:
      NODE_ENV: development
      CONTEMBER_PORT: 4000
      CONTEMBER_MONITORING_PORT: 4001
      CONTEMBER_ROOT_EMAIL: 'admin@localhost'
      CONTEMBER_ROOT_PASSWORD: 'admin@localhost'
      CONTEMBER_ROOT_TOKEN: '0000000000000000000000000000000000000000'
      CONTEMBER_API_TOKEN: '0000000000000000000000000000000000000000'
      CONTEMBER_LOGIN_TOKEN: '1111111111111111111111111111111111111111'
      CONTEMBER_API_URL: 'http://localhost:4000'
      CONTEMBER_APPLICATION_WORKER: 'all'
      # Off by default in production; on here so local development finds it at /panel. This service
      # runs from source, so the assets are not in the bundle — build them once with
      # `bun run --filter=@contember/engine-panel build:assets`, otherwise the engine logs that the
      # panel is enabled but unbuilt and serves nothing.
      CONTEMBER_PANEL_ENABLED: 'true'
      DEFAULT_DB_STATEMENT_TIMEOUT_MS: 3000
      DEFAULT_DB_QUERY_TIMEOUT_MS: 3000
      DEFAULT_DB_HOST: 'postgres'
      DEFAULT_DB_PORT: '5432'
      DEFAULT_DB_USER: 'contember'
      DEFAULT_DB_PASSWORD: 'contember'
      DEFAULT_DB_POOL_MAX_IDLE: '1'
      TEST_DB_HOST: 'postgres'
      TEST_DB_PORT: '5432'
      TEST_DB_USER: 'contember'
      TEST_DB_PASSWORD: 'contember'
      TENANT_DB_NAME: 'tenant'
      TENANT_MAILER_HOST: 'mailhog'
      TENANT_MAILER_PORT: '1025'
      TENANT_MAILER_FROM: 'contember@localhost'
      # A Contember provider name, not the image behind `object-storage`: it selects path-style
      # addressing and no object ACL (public read comes from the store's own config instead).
      DEFAULT_S3_PROVIDER: 'minio'
      DEFAULT_S3_REGION: ''
      DEFAULT_S3_BUCKET: 'contember'
      DEFAULT_S3_PREFIX: 'data'
      DEFAULT_S3_KEY: 'contember'
      DEFAULT_S3_SECRET: 'contember'
      # The host port from docker-compose.override.dist.yaml, not the service name: the engine only
      # signs URLs here and hands them to the browser, which resolves them itself.
      DEFAULT_S3_ENDPOINT: 'http://localhost:3003'
      CONTEMBER_PACKAGE_JSON: /src/packages/engine-server/package.json
    volumes:
      - .:/src:cached
    command:
      - bun
      - "--watch"
      - "--conditions=typescript"
      - ./packages/engine-server/src/start.ts
    healthcheck:
#      test: 'curl --fail http://localhost:4000'
      test: [ "CMD", "bash", "-c", "echo > /dev/tcp/localhost/4000" ]
      interval: 5s
      timeout: 5s
      retries: 10

    depends_on:
      postgres:
        condition: service_healthy


  cli:
    image: oven/bun:1.3.10
    working_dir: /src/packages/playground
    deploy:
      replicas: 0

    environment:
      CONTEMBER_SKIP_VERSION_CHECK: 1
      CONTEMBER_API_URL: 'http://engine:4000/'
      CONTEMBER_API_TOKEN: '0000000000000000000000000000000000000000'
      CONTEMBER_PROJECT_NAME: playground

    volumes:
      - ./:/src
    entrypoint:
      - bun
      - "--conditions=typescript"
      - /src/packages/cli/src/run.ts
#    depends_on:
#      engine:
#        condition: service_healthy


  # S3-compatible storage for the engine's asset bucket. SeaweedFS rather than MinIO: minio/minio
  # and minio/mc are archived upstream, the newest published MinIO image predates the fix for
  # MinIO's own CVE-2025-62506, and the Bitnami catalog the old image came from is frozen.
  object-storage:
    image: chrislusf/seaweedfs:4.42

    # `mini` runs master + volume + filer + S3 in a single process. Both flags override a default
    # that would bite us: `autoCreateBucket` is on by default and silently creates a bucket on the
    # first write, so a typo would look like a working upload, and telemetry is on by default and
    # reports to telemetry.seaweedfs.com every 24 h.
    command: >
      mini -dir=/data -s3.port=9000 -s3.config=/etc/seaweedfs/identities.json
      -s3.autoCreateBucket=false -master.telemetry=false

    environment:
      # Created on start, an existing one left alone. Public read and the signing credentials live
      # in the identities file — see its README.
      S3_BUCKET: 'contember'

    volumes:
      - object-storage-data:/data
      - ./docker/object-storage/identities.json:/etc/seaweedfs/identities.json:ro

    # The S3 port starts answering ~0.5 s before the bucket exists, so probing it (or `/healthz`)
    # would report ready while an upload still fails with `NoSuchBucket`. The filer 404s on a bucket
    # that isn't there yet, so ask it instead.
    healthcheck:
      test: [ 'CMD-SHELL', 'curl -fsS -o /dev/null "http://127.0.0.1:8888/buckets/contember/?limit=1"' ]
      interval: 2s
      timeout: 3s
      retries: 30


  adminer:
    image: michalhosna/adminer:latest

    environment:
      ADMINER_DRIVER: pgsql
      ADMINER_SERVER: postgres
      ADMINER_DB: contember
      ADMINER_USERNAME: contember
      ADMINER_PASSWORD: contember
      ADMINER_AUTOLOGIN: 1
      ADMINER_NAME: Contember

    depends_on:
      - postgres


  postgres:
    image: postgres:16-alpine

    environment:
      POSTGRES_PASSWORD: contember
      POSTGRES_USER: contember
      POSTGRES_DB: contember

    volumes:
      - pgsql-data:/var/lib/postgresql/data

    healthcheck:
      test: 'pg_isready --username contember'
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s


  redis:
    image: redis:3.2-alpine

  mailhog:
    image: mailhog/mailhog
    environment:
      MH_CORS_ORIGIN: '*'
volumes:
  pgsql-data: ~
  object-storage-data: ~
