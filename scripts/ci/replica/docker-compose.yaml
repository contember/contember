# A streaming primary and its hot standby on the official `postgres` image, so that `e2e/replica`
# can be reproduced locally. The `test-db-replica` CI job starts this very file - the topology is
# described here once. See ./README.md for the commands.
name: contember-replica

services:

  db:
    image: postgres:${POSTGRES_VERSION:-16}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # wal_keep_size covers the gap between the base backup and the standby's first stream
    command: [ 'postgres', '-c', 'wal_keep_size=256MB' ]
    volumes:
      - primary-data:/var/lib/postgresql/data
      - ./primary-init.sh:/docker-entrypoint-initdb.d/10-replication-hba.sh:ro
    ports:
      - '${PRIMARY_PORT:-5432}:5432'
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U postgres' ]
      interval: 2s
      timeout: 5s
      retries: 30

  db_replica:
    image: postgres:${POSTGRES_VERSION:-16}
    depends_on:
      db:
        condition: service_healthy
    # the entrypoint's initdb dance only runs for `postgres`; this takes the data from the primary instead
    user: postgres
    command:
      - bash
      - -c
      - |
        set -e
        if [ ! -s "$$PGDATA/PG_VERSION" ]; then
          pg_basebackup --host=db --port=5432 --username=postgres --pgdata="$$PGDATA" --wal-method=stream --write-recovery-conf --progress
          chmod 0700 "$$PGDATA"
        fi
        exec postgres
    volumes:
      - standby-data:/var/lib/postgresql/data
    ports:
      - '${STANDBY_PORT:-5433}:5432'
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U postgres' ]
      interval: 2s
      timeout: 5s
      # the base backup runs before the server starts
      retries: 60

volumes:
  primary-data:
  standby-data:
